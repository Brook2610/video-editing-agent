name: Deploy to AWS EC2

on:
  push:
    branches:
      - modification-branch
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::460294045578:role/video-editor-agent-github-deploy-role
          aws-region: us-east-1

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00057e17c9458f370 \
            --document-name AWS-RunShellScript \
            --comment "Deploy video-editing-agent from GitHub Actions" \
            --parameters commands='["cd /opt/video-editing-agent && git -c safe.directory=/opt/video-editing-agent fetch origin modification-branch && git -c safe.directory=/opt/video-editing-agent reset --hard origin/modification-branch && chown -R ubuntu:ubuntu /opt/video-editing-agent", "bash /opt/video-editing-agent/scripts/deploy_aws.sh"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00057e17c9458f370

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00057e17c9458f370 \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
